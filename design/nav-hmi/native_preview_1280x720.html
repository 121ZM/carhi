<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CarHi · Native 自绘桌面 版式预览（1280×720）</title>
<style>
  :root{
    --bg-base:#0A0C10; --bg-surface:#141821; --bg-elevated:#1E2430;
    --accent:#2E9BFF; --accent-dim:#1A3A5C;
    --fg1:#FFFFFF; --fg2:#C3CBD9; --fg3:#7C879B;
    --border:#232A36;
    --font-sans:"HarmonyOS Sans SC","HarmonyOS Sans","Noto Sans SC",

  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#05070A;}
  body{font-family:var(--font-sans);color:#E6EDF3;padding:32px 28px 48px;}
  .head{max-width:1280px;margin:0 auto 20px;}
  .head h1{font-size:20px;font-weight:700;}
  .head p{font-size:13px;color:#8B949E;margin-top:6px;line-height:1.6;}
  .head code{color:#7EE0B8;font-family:ui-monospace,Consolas,monospace;font-size:12px;}
  .stage{max-width:1280px;margin:0 auto 34px;}
  .label{font-size:14px;color:#C3CBD9;margin:0 0 10px 2px;}
  .label b{color:#2E9BFF;}
  .screen{width:1280px;height:720px;border-radius:16px;overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 1px #1B2230;display:block;}
  svg{display:block;}
</style>
</head>
<body>

<div class="head">
  <h1>CarHi · Native 自绘桌面 · 版式预览</h1>
  <p>
    这不是设计稿，是 <code>cpp/hmi_renderer.cpp</code> <b>绘制代码的 1:1 版式</b>：
    同一套坐标常量、同一套调色板（<code>kRailW=76 / kMidW=296 / kPad=18</code>）。
    用于在没有真机时复核「native 实际会画出什么」。真机出图待设备接上后核对。
  </p>
</div>
